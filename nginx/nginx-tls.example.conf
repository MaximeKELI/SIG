# Exemple nginx TLS (production) — à utiliser derrière Let's Encrypt
# ou monter certificats dans le conteneur nginx.
#
# Usage :
#   1. Obtenir certs (certbot / cloudflare / etc.)
#   2. Mount /etc/letsencrypt ou ./certs
#   3. Remplacer nginx.conf par cette config (ou include)

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Prod plus strict que le dev (auth 15/m)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name exemple.example.tg;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        set $django_host web;

        location /static/ { alias /usr/share/nginx/static/; }
        location /media/  { alias /usr/share/nginx/media/; }
        location / {
            root /usr/share/nginx/html/frontend;
            try_files $uri $uri/ /index.html;
        }

        location /ws/ {
            proxy_pass http://$django_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~ ^/api/v1/auth/(login|register|token)/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://$django_host:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://$django_host:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /admin/ {
            proxy_pass http://$django_host:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health/ {
            proxy_pass http://$django_host:8000;
            proxy_set_header Host $host;
        }
    }
}
