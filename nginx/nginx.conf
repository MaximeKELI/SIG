worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    server_tokens off;

    # Résolution DNS Docker à chaque requête (évite l'ancien conteneur web orphelin).
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=500r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    server {
        listen 80;
        server_name localhost;

        # Toujours utiliser le nom de service Compose (DNS stable)
        set $django_host web;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        location /static/ {
            alias /usr/share/nginx/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /usr/share/nginx/media/;
            autoindex off;
            # Pas de listing ; téléversement via API authentifiée uniquement.
            limit_except GET HEAD { deny all; }
        }

        location = /privacy.html {
            root /usr/share/nginx/html/frontend;
            add_header Cache-Control "public, max-age=3600";
        }

        location = /sw.js {
            root /usr/share/nginx/html/frontend;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        location = /manifest.json {
            root /usr/share/nginx/html/frontend;
            add_header Cache-Control "no-cache";
        }

        location /frontend/ {
            alias /usr/share/nginx/html/frontend/;
        }

        location = /index.html {
            root /usr/share/nginx/html/frontend;
            add_header Cache-Control "no-cache";
        }

        location / {
            root /usr/share/nginx/html/frontend;
            try_files $uri $uri/ /index.html;
        }

        location /ws/ {
            proxy_pass http://$django_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Compose local :8081 est en HTTP ; Django (SECURE_SSL_REDIRECT) exige https côté proxy.
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        location ~ ^/api/v1/auth/(login|register|token)/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://$django_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://$django_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        location /admin/ {
            proxy_pass http://$django_host:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /health/ {
            proxy_pass http://$django_host:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
